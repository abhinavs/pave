name: ci

# The deploy gate, mirrored in CI. `fab validate` is the local equivalent;
# this workflow is what blocks a PR from merging. It runs the same checks
# in the same order so a green CI guarantees a deployable branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pave
          POSTGRES_PASSWORD: pave
          POSTGRES_DB: pave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pave:pave@localhost:5432/pave_test
      SONIQ_DATABASE_URL: postgresql://pave:pave@localhost:5432/pave_test
      SECRET_KEY: ci-secret-do-not-use-in-prod
      ALLOWED_HOSTS: "*"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      # vrk is Pave's deploy/operations toolkit. CI uses it to stamp a
      # structured run id (vrk epoch) and to tag/mask the pytest log stream
      # (vrk mask | vrk emit) so workflow logs are searchable and secret-safe.
      - name: Install vrk
        run: |
          curl -fsSL https://vrk.sh/install.sh | bash
          echo "$HOME/.vrk/bin" >> "$GITHUB_PATH"

      - name: Stamp a run id (vrk epoch)
        id: stamp
        run: |
          ts=$(vrk epoch --now)
          echo "run_id=ci-${ts}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: pave lint

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Type check (mypy)
        run: pave typecheck

      - name: Apply migrations
        run: pave migrate

      - name: Run tests
        # Pipe pytest through vrk so warnings, errors and pass lines get
        # tagged with structured levels in the workflow log. vrk mask
        # scrubs any secret-looking strings before emit, which matters
        # because GitHub Actions logs are public for public repos.
        run: |
          set -o pipefail
          pave test 2>&1 \
            | vrk mask \
            | vrk emit --tag "${{ steps.stamp.outputs.run_id }}" --parse-level

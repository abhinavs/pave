# Nginx site for Pave. Copy to /etc/nginx/sites-available/pave, replace every
# {{domain}} with the real host, symlink into sites-enabled, then run
# `fab production setup-tls` (Certbot) to fill in the certificate lines.
#
# Nginx terminates TLS and proxies to Gunicorn over a Unix socket. Static
# files are served straight from disk, never through the app.

# Rate limiting, on by default: 10 req/s per client IP with a burst of 20
# (see the location block below). Raise the rate if your traffic is higher;
# this is a sane abuse/login-flood cap, not a throughput limit.
limit_req_zone $binary_remote_addr zone=pave_app:10m rate=10r/s;

upstream pave_app {
    server unix:/run/pave/pave.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name {{domain}};

    # Certbot writes its HTTP-01 challenge here; everything else is forced
    # to HTTPS once a certificate exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name {{domain}};

    # Filled in by `fab production setup-tls` (Certbot).
    ssl_certificate     /etc/letsencrypt/live/{{domain}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{domain}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # Edge security headers. HSTS pins HTTPS for a year (only sent over TLS,
    # so it never traps a plain-http host). The CSP is a baseline tuned to
    # what the app actually loads: HTMX/Alpine from unpkg, inline Alpine
    # expressions (need unsafe-inline/eval), self-hosted fonts and CSS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Static assets are fingerprinted and immutable: serve and cache hard.
    location /static/ {
        alias /srv/pave/current/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        # The deploy health check hits this. No rate limit, no caching.
        proxy_pass http://pave_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        # Per-IP rate limit (zone defined above). burst absorbs short spikes;
        # nodelay serves the burst immediately rather than queuing it.
        limit_req zone=pave_app burst=20 nodelay;

        proxy_pass http://pave_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }
}

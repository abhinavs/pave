# journald limits for Pave. Installed by `fab production setup-log-rotation`
# to /etc/systemd/journald.conf.d/pave.conf, so it overrides the distro
# defaults without editing the main journald.conf.
#
# Pave logs to stdout (structured JSON via structlog); systemd captures that
# into the journal. Read it with `fab logs` or `journalctl -u pave-api`. These
# caps keep a chatty deploy day from filling the disk. Tune for your volume,
# then re-run setup-log-rotation (or `sudo systemctl restart systemd-journald`).

[Journal]
SystemMaxUse=2G
SystemKeepFree=2G
SystemMaxFileSize=200M

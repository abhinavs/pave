<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Favicons render outside the page's CSS context (no currentColor)
       and `prefers-color-scheme` inside SVG favicons is inconsistent in
       Chromium and Safari, so we cannot rely on a media-query swap. The
       brand violet has enough contrast against both light and dark
       browser chrome that one baked-in colour is the safer call. -->
  <rect width="256" height="256" fill="none"/>
  <polygon fill="#7c3aed" opacity="0.22" points="232 192 160 64 96 64 24 192 232 192"/>
  <g fill="none" stroke="#7c3aed" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">
    <line x1="96" y1="64" x2="24" y2="192"/>
    <line x1="160" y1="64" x2="232" y2="192"/>
    <line x1="128" y1="64" x2="128" y2="80"/>
    <line x1="128" y1="120" x2="128" y2="136"/>
    <line x1="128" y1="176" x2="128" y2="192"/>
    <line x1="24" y1="64" x2="232" y2="64"/>
  </g>
</svg>

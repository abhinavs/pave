{% for e in events %}
<tr class="border-b border-[--border-subtle]">
  <td class="px-3 py-2 font-mono text-sm">{{ e.slug }}</td>
  <td class="px-3 py-2">
    <span
      class="rounded border border-[--border-muted] bg-[--bg-hover] px-2 py-0.5 text-xs font-medium"
      >{{ e.status }}</span
    >
  </td>
  <td class="px-3 py-2 font-mono text-xs text-[--text-secondary]">
    {{ e.created_at }}
  </td>
</tr>
{% else %}
<tr>
  <td colspan="3" class="px-3 py-6 text-center text-sm text-[--text-secondary]">
    No webhook events match.
  </td>
</tr>
{% endfor %}

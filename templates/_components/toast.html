{# Toast host. Routes set HX-Trigger: {"showToast": {...}}; htmx dispatches
   that as a window event. This element listens and renders a stack. Mount it
   once in base.html. Never return a toast in a response body. #}
<div
  x-data="{
    toasts: [],
    push(detail) {
      const id = Date.now();
      this.toasts.push({ id, ...detail });
      setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 4000);
    }
  }"
  x-on:show-toast.window="push($event.detail)"
  data-hx-trigger-name="showToast"
  class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
>
  <template x-for="t in toasts" :key="t.id">
    <div
      x-transition.duration.200ms
      class="rounded-md border border-[--border-subtle] bg-[--bg-surface] px-3 py-2 text-sm text-[--text-primary]"
      :class="{
        'border-success/30 text-success': t.type === 'success',
        'border-error/30 text-error': t.type === 'error'
      }"
      x-text="t.message"
    ></div>
  </template>
</div>

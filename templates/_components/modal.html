{# Alpine modal. Context: modal_id, title, optional body (safe HTML).
   Open it from anywhere with: $dispatch('open-modal', '<modal_id>'). #}
<div
  x-data="{ open: false }"
  x-on:open-modal.window="if ($event.detail === '{{ modal_id }}') open = true"
  x-show="open"
  x-cloak
  class="fixed inset-0 z-50 flex items-center justify-center"
>
  <div
    class="absolute inset-0 bg-black/60"
    x-on:click="open = false"
  ></div>
  <div
    id="{{ modal_id }}"
    role="dialog"
    aria-modal="true"
    aria-label="{{ title }}"
    x-transition.duration.200ms
    class="relative w-full max-w-md rounded-lg border border-[--border-subtle] bg-[--bg-surface] p-5"
  >
    <div class="mb-3 flex items-center justify-between">
      <h2 class="text-base font-semibold text-[--text-primary]">
        {{ title }}
      </h2>
      <button
        type="button"
        x-on:click="open = false"
        class="text-[--text-secondary] hover:text-[--text-primary]"
        aria-label="Close"
      >
        ✕
      </button>
    </div>
    <div class="text-sm text-[--text-secondary]">{{ body | default('') | safe }}</div>
  </div>
</div>
